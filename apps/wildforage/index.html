<script>
async function submitWaitlist(e) {
  e.preventDefault();
  var form = e.target;
  var btn = document.getElementById('wl-btn');
  var fields = document.getElementById('wl-fields');
  var success = document.getElementById('wl-success');
  var error = document.getElementById('wl-error');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  success.style.display = 'none';
  error.style.display = 'none';
  var data = {
    name: form.elements.name.value.trim(),
    email: form.elements.email.value.trim(),
    app: document.title.split('—')[0].trim()
  };
  try {
    var res = await fetch('/api/waitlist', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (res.ok) {
      fields.style.display = 'none';
      success.style.display = 'block';
    } else {
      throw new Error('Server error');
    }
  } catch(err) {
    error.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Join Waiting List ✉️';
  }
}
</script>
